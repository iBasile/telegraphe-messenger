name: Server

on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: telegraphe_test
          POSTGRES_USER: telegraphe
          POSTGRES_PASSWORD: telegraphe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telegraphe -d telegraphe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run proto:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run migrate
        env:
          DATABASE_URL: postgresql://telegraphe:telegraphe@localhost:5432/telegraphe_test
          JWT_SECRET: ci-only-secret-that-is-long-enough
      - run: npm test
        env:
          DATABASE_URL: postgresql://telegraphe:telegraphe@localhost:5432/telegraphe_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-only-secret-that-is-long-enough
          EMAIL_PROVIDER: console
